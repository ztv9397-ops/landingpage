<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Jackpot Pejuang Kasino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            min-height: 100vh;
            background: #f8fafc;
        }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th, td { border: 1px solid #cbd5e1 !important; padding: 14px 12px !important; }
        tr:last-child td { border-bottom: 2px solid #cbd5e1 !important; }
        th { border-bottom-width: 2px !important; white-space: nowrap; }

        button {
            transition: all 0.12s ease !important;
            position: relative;
            overflow: hidden;
        }
        button:active {
            transform: translateY(2px) scale(0.97);
            filter: brightness(0.85);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.15) !important;
        }
        button:active::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.3);
            opacity: 0;
            animation: kilatan 0.2s ease-out;
        }
        @keyframes kilatan {
            0% { opacity: 0.5; transform: scale(1.05); }
            100% { opacity: 0; }
        }
        .bg-blue-600, .bg-green-600, .bg-purple-600, .bg-red-600 {
            box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.1);
        }
        .bg-blue-600:active, .bg-green-600:active, 
        .bg-purple-600:active, .bg-red-600:active {
            box-shadow: 0 1px 0 rgba(0,0,0,0.15), inset 0 2px 4px rgba(0,0,0,0.15) !important;
        }

        .centang-bulat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e 0%, #3b82f6 100%);
            color: white;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.3);
            flex-shrink: 0;
        }
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .table-container table {
            min-width: 700px;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-crown text-blue-600 text-xl"></i>
                <span class="text-xl font-bold text-gray-900">PEJUANG KASINO</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 pb-12">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">DATABASE JACKPOT PEJUANG KASINO</h1>

        <!-- Pencarian -->
        <div class="bg-white p-5 rounded-lg shadow mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Cari Nomor / Data</label>
            <div class="flex gap-3">
                <input type="text" id="kataCari" oninput="filterTabel()" placeholder="Ketik nomor atau nama..." 
                    class="flex-1 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-base">
                <button onclick="resetCari()" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-3 rounded-lg font-medium">
                    <i class="fa-solid fa-times"></i> Clear
                </button>
            </div>
        </div>

        <!-- Input Data -->
        <div class="bg-white p-5 rounded-lg shadow mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">Masukan Data (Format: NAMA Nomor)</label>
            <textarea id="areaInput" rows="4" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-base"
                placeholder="ANDI 081234567890&#10;BUDI 089876543210"></textarea>
            <button onclick="tambahDariInput()" 
                class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-lg font-medium">
                <i class="fa-solid fa-paste mr-2"></i> Masukkan ke Database
            </button>
        </div>

        <!-- Tabel Diperluas & Tidak Terpotong -->
        <div class="bg-white rounded-lg shadow mb-5">
            <div class="table-container">
                <table>
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="w-[16%]">GAME</th>
                            <th class="w-[14%]">STATUS</th>
                            <th class="w-[24%]">DATABASE</th>
                            <th class="w-[22%]">KETERANGAN</th>
                            <th class="w-[14%]">JACKPOT</th>
                            <th class="w-[16%]">KONFIRMASI</th>
                        </tr>
                    </thead>
                    <tbody id="badanTabel"></tbody>
                </table>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="flex flex-wrap gap-4">
            <button onclick="tambahBarisKosong()" 
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-medium text-base">
                <i class="fa-solid fa-plus mr-2"></i> Tambah Baris
            </button>
            <button onclick="simpanSemua()" 
                class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-medium text-base">
                <i class="fa-solid fa-save mr-2"></i> SIMPAN DATA
            </button>
            <button onclick="hapusSemuaSekaliKlik()" 
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-medium text-base">
                <i class="fa-solid fa-trash mr-2"></i> HAPUS SEMUA BARIS
            </button>
        </div>
    </main>

    <!-- Popup Pilih Nominal -->
    <div id="popupNominal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 invisible transition-all duration-300">
        <div class="bg-white rounded-xl p-6 w-[92%] max-w-md relative">
            <button onclick="tutupPopupNominal()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            <h3 class="text-lg font-bold text-gray-800 mb-1">Pilih Nominal</h3>
            <p class="text-sm text-gray-500 mb-4">Klik nominal yang diinginkan</p>
            <div id="daftarPilihan" class="grid grid-cols-3 gap-2 mb-4"></div>
            <div class="flex gap-2">
                <button onclick="tutupPopupNominal()" class="flex-1 bg-gray-200 hover:bg-gray-300 py-2.5 rounded-lg font-medium">Batal</button>
                <button onclick="terapkanNominal()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Popup Klaim -->
    <div id="popupKlaim" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 invisible transition-all duration-300">
        <div class="bg-white rounded-xl p-6 w-[92%] max-w-md relative">
            <button onclick="tutupPopupKlaim()" class="absolute top-3 right-4 text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            <div class="w-16 h-16 mx-auto mb-4 bg-yellow-50 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-exclamation-triangle text-yellow-500 text-3xl"></i>
            </div>
            <p class="text-gray-600 my-5 text-center">
                Mohon Maaf, KEMENANGAN tidak dapat diberikan,<br>
                karena nomor ini belum melakukan DEPOSIT atau belum TERDAFTAR.
            </p>
            <button onclick="tutupPopupKlaim()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium">Tutup</button>
        </div>
    </div>

    <script>
        let barisSaatIni = null;
        let nilaiDipilih = null;
        const daftarNilai = [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000];

        function keRupiah(angka) {
            if (!angka) return '';
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        function bukaPilihNominal(tombol) {
            barisSaatIni = tombol.closest('tr');
            nilaiDipilih = null;
            const wadah = document.getElementById('daftarPilihan');
            wadah.innerHTML = '';
            daftarNilai.forEach(n => {
                const btn = document.createElement('button');
                btn.className = 'px-4 py-2.5 rounded-lg border border-gray-200 bg-gray-50 hover:bg-green-50 hover:border-green-300 text-gray-700 font-medium text-sm';
                btn.textContent = keRupiah(n);
                btn.onclick = () => {
                    document.querySelectorAll('#daftarPilihan button').forEach(b => {
                        b.classList.remove('bg-green-500','text-white','border-green-500');
                    });
                    btn.classList.add('bg-green-500','text-white','border-green-500');
                    nilaiDipilih = n;
                };
                wadah.appendChild(btn);
            });
            document.getElementById('popupNominal').classList.remove('opacity-0','invisible');
        }

        function tutupPopupNominal() {
            document.getElementById('popupNominal').classList.add('opacity-0','invisible');
            barisSaatIni = null;
            nilaiDipilih = null;
        }

        function terapkanNominal() {
            if (!nilaiDipilih) { alert('Pilih nominal dulu!'); return; }
            const tombol = barisSaatIni.querySelector('.tombol-nominal');
            tombol.innerHTML = `<span class="font-bold text-green-600">${keRupiah(nilaiDipilih)}</span>`;
            tombol.dataset.nilai = nilaiDipilih;
            tombol.classList.add('bg-green-50','border-green-200');
            tutupPopupNominal();
        }

        function bukaPopupKlaim() {
            document.getElementById('popupKlaim').classList.remove('opacity-0','invisible');
        }
        function tutupPopupKlaim() {
            document.getElementById('popupKlaim').classList.add('opacity-0','invisible');
        }

        function buatBaris(game='PG/PRAGMATIC', status='PENDING', isiDb='', nominal='') {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-50';
            
            const tampilGame = `
                <span class="inline-block bg-blue-50 border border-blue-200 text-blue-700 font-semibold px-3 py-2 rounded-lg text-sm whitespace-nowrap">
                    ${game}
                </span>
            `;
            
            const tampilStatus = `
                <span class="inline-flex items-center gap-2 bg-yellow-50 border border-yellow-300 text-yellow-700 font-medium px-3 py-1.5 rounded-full text-sm whitespace-nowrap">
                    <span class="w-2.5 h-2.5 bg-yellow-400 rounded-full"></span>
                    ${status}
                </span>
            `;
            
            tr.innerHTML = `
                <td contenteditable="true">${tampilGame}</td>
                <td>${tampilStatus}</td>
                <td contenteditable="true" class="text-sm">${isiDb}</td>
                <td>
                    <div class="flex items-center gap-2">
                        <span class="centang-bulat">✓</span>
                        <span class="text-sm text-gray-700 font-medium">Kemenangan Pengisian Pertama</span>
                    </div>
                </td>
                <td>
                    <button class="tombol-nominal w-full flex items-center justify-between px-3 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-gray-700 font-semibold text-sm hover:bg-blue-50" data-nilai="${nominal}" onclick="bukaPilihNominal(this)">
                        ${nominal ? `<span class="font-bold text-green-600">${keRupiah(nominal)}</span>` : `<span>MAXWIN</span><i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>`}
                    </button>
                </td>
                <td>
                    <button onclick="bukaPopupKlaim()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium">CLAIM</button>
                </td>
            `;
            return tr;
        }

        function tambahBarisKosong() {
            document.getElementById('badanTabel').appendChild(buatBaris());
        }

        function tambahDariInput() {
            const teks = document.getElementById('areaInput').value.trim();
            if (!teks) return;
            teks.split('\n').forEach(baris => {
                const bagian = baris.trim().split(/\s+/);
                const nomor = bagian.find(x => /^\d+$/.test(x)) || '';
                const nama = bagian.filter(x => !/^\d+$/.test(x)).join(' ');
                document.getElementById('badanTabel').appendChild(buatBaris('PG/PRAGMATIC', 'PENDING', (nama+' '+nomor).trim()));
            });
            alert('Data ditambahkan!');
            document.getElementById('areaInput').value = '';
        }

        function simpanSemua() {
            const semua = [];
            document.querySelectorAll('#badanTabel tr').forEach(tr => {
                semua.push({
                    game: tr.cells[0].innerText.trim(),
                    status: tr.cells[1].innerText.trim().replace('●','').trim(),
                    database: tr.cells[2].innerText.trim(),
                    nominal: tr.querySelector('.tombol-nominal').dataset.nilai || ''
                });
            });
            localStorage.setItem('dataJackpotAkhir', JSON.stringify(semua));
            alert('✅ DATA TERSIMPAN!');
        }

        function hapusSemuaSekaliKlik() {
            if (confirm('⚠️ Yakin ingin MENGHAPUS SEMUA BARIS? Tindakan ini tidak bisa dibatalkan!')) {
                document.getElementById('badanTabel').innerHTML = '';
                localStorage.removeItem('dataJackpotAkhir');
                alert('✅ SEMUA BARIS TELAH DIHAPUS!');
            }
        }

        function filterTabel() {
            const kata = document.getElementById('kataCari').value.toUpperCase();
            document.querySelectorAll('#badanTabel tr').forEach(tr => {
                tr.style.display = tr.cells[2].innerText.toUpperCase().includes(kata) ? '' : 'none';
            });
        }
        function resetCari() {
            document.getElementById('kataCari').value = '';
            filterTabel();
        }

        function muatSaatMulai() {
            const simpanan = localStorage.getItem('dataJackpotAkhir');
            if (simpanan) {
                JSON.parse(simpanan).forEach(item => {
                    document.getElementById('badanTabel').appendChild(
                        buatBaris(item.game, item.status, item.database, item.nominal)
                    );
                });
            }
        }

        muatSaatMulai();
    </script>
</body>
</html>
