<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidak Ada Koneksi</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
        body{
            background: #eef2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
        }
        .card{
            background: white;
            padding: 45px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
            max-width: 420px;
            width: 100%;
        }
        .signal-icon{
            font-size: 70px;
            color: #e67e22;
            margin-bottom: 15px;
        }
        h1{
            font-size: 24px;
            color: #2d3436;
            margin-bottom: 10px;
        }
        p{
            color: #636e72;
            line-height: 1.7;
            margin-bottom: 25px;
        }
        .btn{
            padding: 12px 32px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background .3s;
        }
        .btn:hover{background: #0769b8;}
        .btn:active{transform: scale(.97);}
        .loading{
            display: none;
            margin-top: 15px;
            color: #0984e3;
            font-size: 15px;
        }
        .check{color: #27ae60; margin-top: 10px; display: none;}
    </style>
</head>
<body>
    <div class="card">
        <div class="signal-icon">📡❌</div>
        <h1>Koneksi Terputus</h1>
        <p>Sepertinya sinyal internet sedang hilang atau tidak stabil.<br>
        Cek kembali koneksi Wi-Fi / data seluler kamu, lalu coba lagi ya.</p>
        
        <button class="btn" onclick="cekUlang()">🔄 Coba Lagi</button>
        
        <div class="loading" id="loading">⏳ Sedang mengecek koneksi...</div>
        <div class="check" id="check">✅ Koneksi kembali normal! Halaman akan dimuat...</div>
    </div>

    <script>
        function cekUlang(){
            document.getElementById('loading').style.display = 'block';
            document.getElementById('check').style.display = 'none';

            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                
                if(navigator.onLine){
                    document.getElementById('check').style.display = 'block';
                    setTimeout(() => location.reload(), 1500);
                }else{
                    alert('❌ Masih belum ada koneksi. Coba cek sinyal kamu dulu ya!');
                }
            }, 2000);
        }
    </script>
</body>
</html>
